name: Tauri Build

on:
  workflow_call:
    inputs:
      tag:
        description: Version tag to build
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build
        required: true
        type: string

concurrency:
  group: tauri-build-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  tauri-build:
    name: Tauri Build - ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            rust-targets: 'aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
    - name: Checkout code
      # CRIT-7: Pinned to commit SHA for supply-chain security (tag: v4)
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      with:
        fetch-depth: 1
        ref: ${{ inputs.tag }}

    - name: Setup pnpm
      # CRIT-7: Pinned to commit SHA for supply-chain security (tag: v4.2.0)
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: 9

    - name: Setup Node.js
      # CRIT-7: Pinned to commit SHA for supply-chain security (tag: v4)
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
      with:
        node-version: '20.19.0'
        cache: pnpm
        cache-dependency-path: dokassist/pnpm-lock.yaml

    - name: Setup Rust
      # CRIT-7: Pinned to commit SHA for supply-chain security (tag: v1)
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        toolchain: stable
        target: ${{ matrix.rust-targets }}

    - name: Cache cargo build
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          dokassist/src-tauri/target
        key: ${{ runner.os }}-tauri-${{ matrix.rust-targets }}-${{ hashFiles('dokassist/src-tauri/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-tauri-${{ matrix.rust-targets }}-${{ hashFiles('dokassist/src-tauri/Cargo.lock') }}-
          ${{ runner.os }}-tauri-${{ matrix.rust-targets }}-

    - name: Install frontend dependencies
      working-directory: ./dokassist
      run: pnpm install --frozen-lockfile --prefer-offline

    - name: Build Tauri app
      working-directory: ./dokassist
      run: pnpm tauri build ${{ matrix.args }}
      env:
        TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    - name: Upload macOS artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: dokassist-${{ matrix.platform }}
        path: |
          dokassist/src-tauri/target/*/release/bundle/dmg/*.dmg
          dokassist/src-tauri/target/*/release/bundle/macos/*.tar.gz
          dokassist/src-tauri/target/*/release/bundle/macos/*.tar.gz.sig
        retention-days: 7
        if-no-files-found: warn

  upload-release-assets:
    name: Upload Release Assets
    needs: tauri-build
    runs-on: ubuntu-latest
    # Upload only after the requested release build succeeds.
    if: always() && needs.tauri-build.result == 'success'
    permissions:
      contents: write

    steps:
    - name: Download macOS artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: 'dokassist-macos-*'
        path: ./artifacts
        merge-multiple: true

    - name: Upload DMGs + generate latest.json
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="${{ inputs.tag }}"
        VERSION="${TAG#v}"
        REPO="${{ github.repository }}"
        BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"

        # Locate Apple Silicon DMG (distribution) and .app.tar.gz + .sig (updater)
        ARM_DMG=$(find ./artifacts -name "*aarch64*.dmg" | head -n1)
        ARM_TAR=$(find ./artifacts -name "*.app.tar.gz" | head -n1)
        ARM_SIG=$(find ./artifacts -name "*.app.tar.gz.sig" | head -n1)

        ARM_URL=""
        ARM_SIG_CONTENT=""

        # Upload DMG as release asset for fresh installs
        if [ -f "$ARM_DMG" ]; then
          echo "Uploading ARM64 DMG: $(basename "$ARM_DMG")"
          gh release upload "$TAG" "$ARM_DMG" --clobber --repo "$REPO"
        else
          echo "Warning: No aarch64 DMG found in artifacts"
        fi

        # Upload .app.tar.gz bundle (used by Tauri updater)
        if [ -f "$ARM_TAR" ]; then
          echo "Uploading ARM64 app.tar.gz: $(basename "$ARM_TAR")"
          gh release upload "$TAG" "$ARM_TAR" --clobber --repo "$REPO"
          ARM_URL="${BASE_URL}/$(basename "$ARM_TAR")"
        else
          echo "Warning: No aarch64 .app.tar.gz found in artifacts"
        fi

        [ -f "$ARM_SIG" ] && ARM_SIG_CONTENT=$(tr -d '\r\n' < "$ARM_SIG")

        # Generate and upload latest.json for Tauri updater
        # NOTE: Tauri v2 requires plain semver (no "v" prefix)
        # URL must point to .app.tar.gz (not .dmg) — that is what the updater downloads
        RELEASE_NOTES=$(gh release view "$TAG" --repo "$REPO" --json body -q .body 2>/dev/null || echo "")
        RELEASE_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

        cat > latest.json <<EOF
        {
          "version": "${VERSION}",
          "notes": $(echo "$RELEASE_NOTES" | jq -Rs .),
          "pub_date": "${RELEASE_DATE}",
          "platforms": {
            "darwin-aarch64": {
              "signature": $(printf '%s' "$ARM_SIG_CONTENT" | jq -Rs .),
              "url": "${ARM_URL}"
            }
          }
        }
        EOF

        echo "Generated latest.json:"
        cat latest.json

        gh release upload "$TAG" latest.json --clobber --repo "$REPO"
        echo "Uploaded latest.json to release $TAG"
