name: Tauri Build

on:
  workflow_call:
    inputs:
      tag:
        description: Version tag to build
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build
        required: true
        type: string
      publish:
        description: Upload assets to the release and publish it (untick for a dry-run build)
        required: false
        default: true
        type: boolean

concurrency:
  group: tauri-build-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  tauri-build:
    name: Tauri Build - ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            # tauri.bundle.conf.json builds and bundles the dokassist-asr dictation worker sidecar.
            args: '--target aarch64-apple-darwin --config src-tauri/tauri.bundle.conf.json'
            rust-targets: 'aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
    - name: Checkout code
      # CRIT-7: Pinned to commit SHA for supply-chain security (tag: v4)
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      with:
        fetch-depth: 1
        ref: ${{ inputs.tag }}

    - name: Setup pnpm
      # CRIT-7: Pinned to commit SHA for supply-chain security (tag: v4.2.0)
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: 9

    - name: Setup Node.js
      # CRIT-7: Pinned to commit SHA for supply-chain security (tag: v4)
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
      with:
        node-version: '24.21.0'
        cache: pnpm
        cache-dependency-path: dokassist/pnpm-lock.yaml

    - name: Setup Rust
      # CRIT-7: Pinned to commit SHA for supply-chain security (tag: v1)
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        toolchain: stable
        target: ${{ matrix.rust-targets }}

    # No target/ cache here: release builds run from the PR-merge event, so any
    # cache they save is scoped to that PR's ref and can never be restored by a
    # later release; it only consumed the 10 GB repo cache quota.

    - name: Install frontend dependencies
      working-directory: ./dokassist
      run: pnpm install --frozen-lockfile --prefer-offline

    # Sign with a stable self-signed identity instead of ad-hoc ("-"). An ad-hoc
    # signature's designated requirement is the build's cdhash, so every update
    # looks like a different app to the legacy keychain and loses access to the
    # SQLCipher key items. A fixed certificate gives a designated requirement of
    # `certificate leaf = H"..."` that stays the same across releases.
    # Gatekeeper still flags the download (that needs a Developer ID +
    # notarization); this only keeps the code identity stable.
    #
    # The secrets are deliberately NOT named APPLE_CERTIFICATE*: tauri-bundler
    # would import those itself, without the code-signing trust setting that
    # codesign requires for a non-Apple certificate.
    - name: Import self-signed code signing identity
      env:
        MACOS_SIGNING_CERT_P12: ${{ secrets.MACOS_SIGNING_CERT_P12 }}
        MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
        MACOS_SIGNING_IDENTITY: RamDoc Self-Signed Code Signing
      run: |
        set -euo pipefail
        if [ -z "$MACOS_SIGNING_CERT_P12" ] || [ -z "$MACOS_SIGNING_CERT_PASSWORD" ]; then
          # Refuse to fall back to ad-hoc: a silent identity change is exactly
          # what makes users lose keychain access after an update.
          echo "::error::MACOS_SIGNING_CERT_P12 / MACOS_SIGNING_CERT_PASSWORD secrets are not set"
          exit 1
        fi

        KEYCHAIN="$RUNNER_TEMP/ramdoc-signing.keychain-db"
        KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
        P12="$RUNNER_TEMP/ramdoc-signing.p12"
        CERT="$RUNNER_TEMP/ramdoc-signing.pem"

        printf '%s' "$MACOS_SIGNING_CERT_P12" | base64 --decode > "$P12"

        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        security set-keychain-settings -lut 21600 "$KEYCHAIN"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        security import "$P12" -k "$KEYCHAIN" -f pkcs12 \
          -P "$MACOS_SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple:,codesign: \
          -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
        # Put the signing keychain on the search list so codesign finds it.
        EXISTING_KEYCHAINS=()
        while IFS= read -r kc; do
          EXISTING_KEYCHAINS+=("$kc")
        done < <(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//')
        security list-keychains -d user -s "$KEYCHAIN" "${EXISTING_KEYCHAINS[@]}"

        # codesign rejects untrusted identities ("no identity found"), so
        # trust the certificate for code signing on this ephemeral runner.
        # The authorizationdb change lets add-trusted-cert run without a GUI
        # prompt.
        security find-certificate -c "$MACOS_SIGNING_IDENTITY" -p "$KEYCHAIN" > "$CERT"
        sudo security authorizationdb write com.apple.trust-settings.admin allow
        sudo security add-trusted-cert -d -r trustRoot -p codeSign \
          -k /Library/Keychains/System.keychain "$CERT"
        rm -f "$P12" "$CERT"

        security find-identity -v -p codesigning "$KEYCHAIN"
        if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "\"$MACOS_SIGNING_IDENTITY\""; then
          echo "::error::'$MACOS_SIGNING_IDENTITY' is not a valid code signing identity on the runner"
          exit 1
        fi

        # tauri-bundler prefers APPLE_SIGNING_IDENTITY over tauri.conf.json's
        # "signingIdentity": "-" (which stays ad-hoc for local builds).
        echo "APPLE_SIGNING_IDENTITY=$MACOS_SIGNING_IDENTITY" >> "$GITHUB_ENV"
        echo "MACOS_SIGNING_IDENTITY=$MACOS_SIGNING_IDENTITY" >> "$GITHUB_ENV"

    - name: Build Tauri app
      working-directory: ./dokassist
      run: pnpm tauri build ${{ matrix.args }}
      env:
        TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    - name: Verify app is signed with the stable identity
      run: |
        set -euo pipefail
        APP=$(find dokassist/src-tauri/target/*/release/bundle/macos -maxdepth 1 -name '*.app' | head -n1)
        if [ -z "$APP" ]; then
          echo "::error::No .app bundle found to verify"
          exit 1
        fi
        codesign --verify --deep --strict --verbose=2 "$APP"
        codesign -dvv "$APP" 2>&1 | grep -E '^(Authority|Signature|TeamIdentifier|Identifier)='
        REQ=$(codesign -d -r- "$APP" 2>&1)
        echo "$REQ"
        # The designated requirement must pin the certificate, not a cdhash;
        # otherwise keychain access would still break on every update.
        if ! echo "$REQ" | grep -q 'certificate leaf'; then
          echo "::error::App designated requirement does not pin the signing certificate"
          exit 1
        fi
        if ! codesign -dvv "$APP" 2>&1 | grep -qx "Authority=$MACOS_SIGNING_IDENTITY"; then
          echo "::error::App is not signed by '$MACOS_SIGNING_IDENTITY'"
          exit 1
        fi
        # Every nested executable (the dokassist-asr sidecar) must carry the
        # same identity, or it would be the one prompting for keychain access.
        find "$APP/Contents/MacOS" -type f -perm -u+x | while read -r bin; do
          if ! codesign -dvv "$bin" 2>&1 | grep -qx "Authority=$MACOS_SIGNING_IDENTITY"; then
            echo "::error::$(basename "$bin") is not signed by '$MACOS_SIGNING_IDENTITY'"
            exit 1
          fi
          echo "OK: $(basename "$bin")"
        done

    - name: Remove signing keychain
      if: always()
      run: security delete-keychain "$RUNNER_TEMP/ramdoc-signing.keychain-db" 2>/dev/null || true

    - name: Upload macOS artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dokassist-${{ matrix.platform }}
        path: |
          dokassist/src-tauri/target/*/release/bundle/dmg/*.dmg
          dokassist/src-tauri/target/*/release/bundle/macos/*.tar.gz
          dokassist/src-tauri/target/*/release/bundle/macos/*.tar.gz.sig
        retention-days: 7
        if-no-files-found: warn

  upload-release-assets:
    name: Upload Release Assets
    needs: tauri-build
    runs-on: ubuntu-latest
    # Upload only after the requested release build succeeds. A manual
    # dispatch with publish unticked is a dry run: build and verify only.
    if: always() && needs.tauri-build.result == 'success' && inputs.publish != false
    permissions:
      contents: write

    steps:
    - name: Download macOS artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: 'dokassist-macos-*'
        path: ./artifacts
        merge-multiple: true

    - name: Upload DMGs + generate latest.json
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="${{ inputs.tag }}"
        VERSION="${TAG#v}"
        REPO="${{ github.repository }}"
        BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"

        # Locate Apple Silicon DMG (distribution) and .app.tar.gz + .sig (updater)
        ARM_DMG=$(find ./artifacts -name "*aarch64*.dmg" | head -n1)
        ARM_TAR=$(find ./artifacts -name "*.app.tar.gz" | head -n1)
        ARM_SIG=$(find ./artifacts -name "*.app.tar.gz.sig" | head -n1)

        # The release stays a draft until everything below is uploaded, so an
        # incomplete build must fail here rather than publish a release whose
        # latest.json is missing or points nowhere.
        for f in "$ARM_DMG" "$ARM_TAR" "$ARM_SIG"; do
          if [ ! -f "$f" ]; then
            echo "::error::Missing release artifact (DMG, .app.tar.gz or .sig) — not publishing $TAG"
            exit 1
          fi
        done

        # Upload DMG as release asset for fresh installs
        echo "Uploading ARM64 DMG: $(basename "$ARM_DMG")"
        gh release upload "$TAG" "$ARM_DMG" --clobber --repo "$REPO"

        # Upload .app.tar.gz bundle (used by Tauri updater)
        echo "Uploading ARM64 app.tar.gz: $(basename "$ARM_TAR")"
        gh release upload "$TAG" "$ARM_TAR" --clobber --repo "$REPO"
        ARM_URL="${BASE_URL}/$(basename "$ARM_TAR")"

        ARM_SIG_CONTENT=$(tr -d '\r\n' < "$ARM_SIG")

        # Generate and upload latest.json for Tauri updater
        # NOTE: Tauri v2 requires plain semver (no "v" prefix)
        # URL must point to .app.tar.gz (not .dmg) — that is what the updater downloads
        RELEASE_NOTES=$(gh release view "$TAG" --repo "$REPO" --json body -q .body 2>/dev/null || echo "")
        RELEASE_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

        cat > latest.json <<EOF
        {
          "version": "${VERSION}",
          "notes": $(echo "$RELEASE_NOTES" | jq -Rs .),
          "pub_date": "${RELEASE_DATE}",
          "platforms": {
            "darwin-aarch64": {
              "signature": $(printf '%s' "$ARM_SIG_CONTENT" | jq -Rs .),
              "url": "${ARM_URL}"
            }
          }
        }
        EOF

        echo "Generated latest.json:"
        cat latest.json

        gh release upload "$TAG" latest.json --clobber --repo "$REPO"
        echo "Uploaded latest.json to release $TAG"

    - name: Publish release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="${{ inputs.tag }}"
        REPO="${{ github.repository }}"
        # release.yml creates releases as drafts so /releases/latest (and the
        # updater's latest.json URL) never points at a release without assets.
        # Only publish drafts: a manual re-build of an older, already
        # published tag must not steal "Latest" from a newer release.
        if [ "$(gh release view "$TAG" --repo "$REPO" --json isDraft -q .isDraft)" = "true" ]; then
          gh release edit "$TAG" --repo "$REPO" --draft=false --latest
          echo "Published $TAG as the latest release"
        else
          echo "$TAG is already published; leaving its Latest status unchanged"
        fi
