name: Lint & Format

on:
  push:
    branches: [ "main", "develop", "claude/**" ]
  pull_request:
    branches: [ "main", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clinical-quantization:
    name: Clinical Quantization Contracts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run quantization workflow tests
        run: python -m unittest tests/test_clinical_quantization.py -v

      - name: Validate the synthetic study fixture
        run: python scripts/clinical_quantization.py validate-manifest research/clinical-quantization/study.synthetic.json

  prettier:
    name: Frontend Formatting
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Setup pnpm
      uses: pnpm/action-setup@v6.1.0
      with:
        version: 9

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20.19.0'
        cache: pnpm
        cache-dependency-path: dokassist/pnpm-lock.yaml

    - name: Install dependencies
      working-directory: ./dokassist
      run: pnpm install --frozen-lockfile --prefer-offline

    - name: Check formatting (Prettier)
      working-directory: ./dokassist
      run: pnpm format:check
      continue-on-error: true

  eslint:
    name: Frontend Linting
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Setup pnpm
      uses: pnpm/action-setup@v6.1.0
      with:
        version: 9

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20.19.0'
        cache: pnpm
        cache-dependency-path: dokassist/pnpm-lock.yaml

    - name: Install dependencies
      working-directory: ./dokassist
      run: pnpm install --frozen-lockfile --prefer-offline

    - name: Run ESLint
      working-directory: ./dokassist
      run: pnpm lint
      continue-on-error: true

    - name: Check design tokens
      working-directory: ./dokassist
      run: pnpm check:design

    - name: Check translations
      working-directory: ./dokassist
      run: pnpm check:i18n

  typos:
    name: Typo Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Check for typos
      # CRIT-7: Pinned to commit SHA for supply-chain security (tag: v1.50.2)
      uses: crate-ci/typos@512fc24f32f44ab01972217aaaf3dc86ec234d53
      with:
        files: |
          ./dokassist/src-tauri/src
          ./dokassist/src
          README.md
      continue-on-error: true
