name: Code Coverage

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Rust changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
    steps:
    - name: Filter changed paths
      id: filter
      if: github.event_name == 'pull_request'
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      with:
        filters: |
          rust:
            - 'dokassist/src-tauri/**'
            - '.github/workflows/coverage.yml'

  coverage:
    name: Code Coverage
    needs: changes
    # Frontend-only PRs report this (required) check from a cheap Linux runner
    # with every step skipped, instead of holding a macOS slot.
    runs-on: ${{ needs.changes.outputs.rust == 'true' && 'macos-latest' || 'ubuntu-latest' }}

    steps:
    - uses: actions/checkout@v7.0.1
      if: needs.changes.outputs.rust == 'true'

    - name: Install Rust toolchain
      if: needs.changes.outputs.rust == 'true'
      uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview

    # cargo-llvm-cov builds into target/llvm-cov-target by default. Only main
    # saves the cache; PR-scoped caches are not reusable across PRs.
    - name: Cache coverage build
      if: needs.changes.outputs.rust == 'true'
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: dokassist/src-tauri -> target/llvm-cov-target
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Install cargo-llvm-cov
      if: needs.changes.outputs.rust == 'true'
      uses: taiki-e/install-action@cargo-llvm-cov

    - name: Generate code coverage
      if: needs.changes.outputs.rust == 'true'
      working-directory: ./dokassist/src-tauri
      run: cargo llvm-cov --all-features --workspace --lib --lcov --output-path lcov.info
      continue-on-error: true

    - name: Upload coverage to Codecov
      if: needs.changes.outputs.rust == 'true'
      uses: codecov/codecov-action@v7
      with:
        files: ./dokassist/src-tauri/lcov.info
        fail_ci_if_error: false
        verbose: true
        token: ${{ secrets.CODECOV_TOKEN }}
      continue-on-error: true

    - name: Generate coverage summary
      if: always() && needs.changes.outputs.rust == 'true'
      working-directory: ./dokassist/src-tauri
      run: |
        if [ -f "lcov.info" ]; then
          echo "Coverage report generated successfully"
          wc -l lcov.info
        else
          echo "Coverage report not generated"
        fi
