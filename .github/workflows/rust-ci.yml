name: Rust CI

on:
  push:
    branches: [ "main", "develop", "claude/**" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]
        rust: [stable, 1.95.0]

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Install Rust toolchain
      # CRIT-7: Pinned to commit SHA for supply-chain security (tag: v1)
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy

    - name: Cache Cargo dependencies and build outputs
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          dokassist/src-tauri/target
        key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('dokassist/src-tauri/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('dokassist/src-tauri/Cargo.lock') }}-
          ${{ runner.os }}-cargo-${{ matrix.rust }}-

    - name: Run cargo check
      working-directory: ./dokassist/src-tauri
      run: cargo check --all-targets

    - name: Run cargo test (lib)
      working-directory: ./dokassist/src-tauri
      run: cargo test --lib

    - name: Validate deterministic local-inference benchmark
      working-directory: .
      run: ./scripts/benchmark-local-inference.py ci

    - name: Run examples
      working-directory: ./dokassist/src-tauri
      run: cargo run --example test_audit
      continue-on-error: true

    # Lint checks run once, reusing the compilation artifacts from above
    - name: Run clippy
      if: matrix.rust == 'stable'
      working-directory: ./dokassist/src-tauri
      run: |
        cargo clippy --all-targets --all-features -- \
          -D warnings \
          -A clippy::too_many_arguments \
          -A clippy::type_complexity

    - name: Check formatting
      if: matrix.rust == 'stable'
      working-directory: ./dokassist/src-tauri
      run: cargo fmt -- --check
