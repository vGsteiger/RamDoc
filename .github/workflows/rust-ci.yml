name: Rust CI

on:
  push:
    branches: [ "main", "develop", "claude/**" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Keep file/line info for backtraces but skip full debuginfo: smaller target
  # dir (and cache), faster linking.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Rust changes
    runs-on: ubuntu-latest
    outputs:
      # Pushes always build (keeps the main-branch cache warm); PRs only when
      # Rust-relevant files changed.
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
    steps:
    - name: Filter changed paths
      id: filter
      if: github.event_name == 'pull_request'
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      with:
        filters: |
          rust:
            - 'dokassist/src-tauri/**'
            - 'scripts/benchmark-local-inference.py'
            - '.github/workflows/rust-ci.yml'

  test:
    name: Test Suite
    needs: changes
    # Frontend-only PRs still report this (required) check, but on a cheap
    # Linux runner where every step is skipped, instead of holding a macOS slot.
    runs-on: ${{ needs.changes.outputs.rust == 'true' && matrix.os || 'ubuntu-latest' }}
    strategy:
      matrix:
        os: [macos-latest]
        rust: [stable, 1.95.0]

    steps:
    - uses: actions/checkout@v7.0.1
      if: needs.changes.outputs.rust == 'true'

    - name: Install Rust toolchain
      if: needs.changes.outputs.rust == 'true'
      # CRIT-7: Pinned to commit SHA for supply-chain security (tag: v1)
      uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy

    # rust-cache prunes workspace artifacts before saving (much smaller than
    # caching all of target/) and keys on toolchain + lockfile automatically.
    # Only main saves: PR-scoped caches can't be restored by other PRs and were
    # evicting the shared main cache from the 10 GB repo quota.
    - name: Cache Rust build
      if: needs.changes.outputs.rust == 'true'
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: dokassist/src-tauri
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Check formatting
      if: needs.changes.outputs.rust == 'true' && matrix.rust == 'stable'
      working-directory: ./dokassist/src-tauri
      run: cargo fmt -- --check

    # Clippy type-checks every target, so a separate `cargo check` is redundant.
    - name: Run clippy
      if: needs.changes.outputs.rust == 'true' && matrix.rust == 'stable'
      working-directory: ./dokassist/src-tauri
      run: |
        cargo clippy --all-targets --all-features -- \
          -D warnings \
          -A clippy::too_many_arguments \
          -A clippy::type_complexity

    - name: Run cargo test (lib)
      if: needs.changes.outputs.rust == 'true' && matrix.rust == 'stable'
      working-directory: ./dokassist/src-tauri
      run: cargo test --lib

    - name: Validate deterministic local-inference benchmark
      if: needs.changes.outputs.rust == 'true' && matrix.rust == 'stable'
      working-directory: .
      run: ./scripts/benchmark-local-inference.py ci

    - name: Run examples
      if: needs.changes.outputs.rust == 'true' && matrix.rust == 'stable'
      working-directory: ./dokassist/src-tauri
      run: cargo run --example test_audit
      continue-on-error: true

    # MSRV: verifying everything compiles on the minimum toolchain is enough;
    # behaviour is covered by the stable test run.
    - name: Check MSRV build
      if: needs.changes.outputs.rust == 'true' && matrix.rust != 'stable'
      working-directory: ./dokassist/src-tauri
      run: cargo check --all-targets
