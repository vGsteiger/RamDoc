[package]
name = "dokassist-asr"
version = "0.21.0"
edition = "2021"
rust-version = "1.95"
publish = false
description = "Out-of-process speech-to-text worker for RamDoc dictation (transcribe.cpp)"

# Why a separate crate and process?
#
# transcribe.cpp vendors its own, patched copy of ggml. The main app already
# statically links llama.cpp's ggml. Linking both into one binary silently
# resolves ~1,800 shared `ggml_*` symbols to whichever archive the linker sees
# first, mixing two ggml versions — undefined behaviour. Running ASR in this
# separate executable keeps the two ggml copies in different address spaces.
# It also returns all ASR memory to the OS as soon as a job ends, so the
# dictation model never competes with the resident LLM.

[[bin]]
name = "dokassist-asr"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
transcribe-cpp = { version = "0.4.2", default-features = false, features = ["metal"] }

[target.'cfg(not(all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
transcribe-cpp = { version = "0.4.2", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
